name: forgepilot-batch3-cap-20260822t120847z-037799412c61
networks:
  default:
    name: forgepilot-batch3-cap-20260822t120847z-037799412c61_default
services:
  ai-stub:
    healthcheck:
      interval: 2s
      retries: 20
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:8080/healthz
      timeout: 2s
    image: nginx:1.29-alpine
    mem_limit: 32m
    networks:
      default: null
    volumes:
      - bind:
          create_host_path: true
        read_only: true
        source: /root/ForgePilot/.trellis/tasks/08-21-batch-3-review-engine-human-loop/evidence/capacity/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        type: bind
  backend:
    build:
      context: /root/ForgePilot/backend
      dockerfile: Dockerfile
    depends_on:
      ai-stub:
        condition: service_healthy
        required: true
      postgres:
        condition: service_healthy
        required: true
    environment:
      - FORGEPILOT_DB_PASSWORD=${FORGEPILOT_DB_PASSWORD:-forgepilot-phase1-local-only}
      - FORGEPILOT_DB_POOL_SIZE=${FORGEPILOT_DB_POOL_SIZE:-5}
      - FORGEPILOT_DB_URL=jdbc:postgresql://postgres:5432/${FORGEPILOT_DB_NAME:-forgepilot}
      - FORGEPILOT_DB_USERNAME=${FORGEPILOT_DB_USERNAME:-forgepilot}
      - FORGEPILOT_SCM_SECRET_KEY=${FORGEPILOT_SCM_SECRET_KEY:-forgepilot-local-only-not-a-real-key}
      - JAVA_TOOL_OPTIONS=${FORGEPILOT_JAVA_TOOL_OPTIONS:--Xms128m -Xmx384m -XX:MaxDirectMemorySize=128m
        -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC -XX:NativeMemoryTracking=summary}
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=capacity
      - FORGEPILOT_AI_API_KEY=capacity-local-only
      - FORGEPILOT_AI_BASE_URL=http://ai-stub:8080/v1
      - FORGEPILOT_AI_CHAT_MODEL=capacity-stub-chat
      - FORGEPILOT_KNOWLEDGE_EMBEDDING_MODEL=capacity-stub-embedding
      - FORGEPILOT_KNOWLEDGE_EMBEDDING_PROVIDER=capacity-stub
      - FORGEPILOT_KNOWLEDGE_EMBEDDING_VERSION=capacity-v1
      - FORGEPILOT_REVIEW_CONCURRENCY=2
      - FORGEPILOT_REVIEW_PENDING_STALL_SECONDS=1
      - FORGEPILOT_REVIEW_QUEUE_CAPACITY=4
      - FORGEPILOT_REVIEW_RECONCILIATION_INTERVAL_MS=1000
    healthcheck:
      interval: 5s
      retries: 24
      start_period: 30s
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:8080/actuator/health/readiness
      timeout: 3s
    mem_limit: 768m
    networks:
      default: null
    ports:
      - ${FORGEPILOT_BIND_ADDRESS:-127.0.0.1}:${FORGEPILOT_BACKEND_PORT:-18080}:8080
    restart: unless-stopped
  frontend:
    build:
      context: /root/ForgePilot/frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
        required: true
    healthcheck:
      interval: 5s
      retries: 12
      start_period: 10s
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:8080/healthz
      timeout: 3s
    mem_limit: 64m
    networks:
      default: null
    ports:
      - ${FORGEPILOT_BIND_ADDRESS:-127.0.0.1}:${FORGEPILOT_FRONTEND_PORT:-18081}:8080
    restart: unless-stopped
  postgres:
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - autovacuum_work_mem=64MB
      - -c
      - max_connections=30
    environment:
      POSTGRES_DB: ${FORGEPILOT_DB_NAME:-forgepilot}
      POSTGRES_PASSWORD: ${FORGEPILOT_DB_PASSWORD:-forgepilot-phase1-local-only}
      POSTGRES_USER: ${FORGEPILOT_DB_USERNAME:-forgepilot}
    healthcheck:
      interval: 5s
      retries: 20
      start_period: 15s
      test:
        - CMD-SHELL
        - pg_isready --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"
      timeout: 3s
    image: pgvector/pgvector:0.8.6-pg15-bookworm@sha256:a947c45cdc5906a1bc951f20a8709e321256343ee0f251e4ae00b5e7def4e6da
    mem_limit: 512m
    networks:
      default: null
    restart: unless-stopped
    shm_size: 160m
    volumes:
      - source: postgres-data
        target: /var/lib/postgresql/data
        type: volume
        volume: {}
volumes:
  postgres-data:
    name: forgepilot-batch3-cap-20260822t120847z-037799412c61_postgres-data
