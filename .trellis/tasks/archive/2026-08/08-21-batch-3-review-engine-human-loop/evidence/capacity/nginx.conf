server {
    listen 8080;
    server_name _;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location = /v1/embeddings {
        default_type application/json;
        return 200 '{"data":[{"embedding":[0.1,0.2,0.3,0.4]}],"usage":{"prompt_tokens":1,"total_tokens":1}}';
    }

    # One structurally valid empty answer works for both Review batch and final
    # synthesis. Extra fields are ignored by the phase that does not own them.
    location = /v1/chat/completions {
        default_type application/json;
        return 200 '{"choices":[{"message":{"content":"{\\"findings\\":[],\\"acEvidence\\":[],\\"acVerdicts\\":[]}"}}],"usage":{"prompt_tokens":15000,"completion_tokens":8,"total_tokens":15008}}';
    }
}

