<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>登录 · RepoSage 墨境书院</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="ink-app login-app">
    <div class="ambient login-ambient" aria-hidden="true">
      <canvas class="particle-canvas" id="inkParticleCanvas"></canvas>
      <div class="taiji-watermark"><span></span></div>
      <div class="paper-grain"></div>
      <div class="cloud cloud-one"></div>
      <div class="cloud cloud-two"></div>
      <div class="cloud cloud-three"></div>
      <svg class="mountain mountain-far" viewBox="0 0 1440 900" preserveAspectRatio="none"><path d="M0 710 C150 650 225 690 325 590 C430 480 510 650 620 565 C760 455 840 650 960 555 C1085 455 1190 600 1440 470 L1440 900 L0 900Z" /></svg>
      <svg class="mountain mountain-near" viewBox="0 0 1440 900" preserveAspectRatio="none"><path d="M0 790 C170 650 280 790 410 675 C535 565 640 770 790 655 C940 545 1105 705 1440 560 L1440 900 L0 900Z" /></svg>
      <div class="ink-mist mist-one"></div>
      <div class="ink-mist mist-two"></div>
    </div>

    <div class="login-shell">
      <section class="login-story" aria-labelledby="loginStoryTitle">
        <a class="brand" href="./login.html" aria-label="RepoSage 墨境书院">
          <span class="brand-mark" aria-hidden="true">睿</span>
          <span><strong>RepoSage</strong><small>墨境审查院</small></span>
        </a>
        <div class="login-story-copy">
          <div class="taiji-title" aria-hidden="true"><div class="taiji-watermark"><span></span></div></div>
          <span class="eyebrow">AI CODE REVIEW GATEKEEPER</span>
          <h1 id="loginStoryTitle">入境观心<br />落墨有据</h1>
          <p>让每一条风险结论回到可验证证据。太极水墨随环境缓慢流动，真正的审查信息始终清晰、稳定、可追溯。</p>
        </div>
        <div class="login-story-note">“静处见风险，动处循证据。”<br />RepoSage 将 Agent 过程、Finding 与 Patch 审批收进同一案卷。</div>
      </section>

      <section class="login-panel-wrap">
        <div class="login-panel">
          <span class="eyebrow">书院门禁</span>
          <h2>登录审查工作台</h2>
          <p>使用组织账户进入。原型不会提交真实凭据。</p>
          <div class="login-error" id="loginError" role="alert" aria-live="assertive" hidden>账号或密码不能为空，请补全后重试。</div>
          <form class="login-form" id="loginForm" novalidate>
            <label class="login-field"><span>组织账号</span><input id="email" name="email" type="email" autocomplete="username" placeholder="name@company.com" aria-describedby="loginError" required /></label>
            <label class="login-field"><span>密码</span><input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" aria-describedby="loginError" required /></label>
            <div class="login-options"><label><input type="checkbox" name="remember" /> 保持登录</label><a href="#" id="forgotLink">忘记密码</a></div>
            <button class="primary-button login-submit" type="submit">入境审查</button>
            <button class="outline-button login-demo" type="button" id="demoLogin">使用演示账户</button>
          </form>
          <div class="login-foot"><button class="text-button" id="motionToggle" aria-pressed="false">静态墨境</button><br />受组织 SSO 与最小权限策略保护</div>
        </div>
      </section>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </main>
  <script src="./login.js"></script>
</body>
</html>
