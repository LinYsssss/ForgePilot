spring:
  application:
    name: reposage-sandbox-runner
  main:
    web-application-type: none
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:code_review}
    password: ${RABBITMQ_PASSWORD:change-me}
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        prefetch: ${SANDBOX_PREFETCH:1}

management:
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://otel-collector:4318/v1/traces}
  metrics:
    tags:
      application: ${spring.application.name}

app:
  sandbox:
    signing-secret: ${SANDBOX_SIGNING_SECRET:}
    work-root: ${SANDBOX_WORK_ROOT:/app/.work}
    dependency-cache-root: ${SANDBOX_DEPENDENCY_CACHE_ROOT:/app/.cache/dependencies}
    archive-root: ${SANDBOX_ARCHIVE_ROOT:/app/archives}
