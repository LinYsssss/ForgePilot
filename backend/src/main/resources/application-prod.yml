spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/code_review}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:code_review}
    password: ${DB_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    defer-datasource-initialization: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  sql:
    init:
      mode: never
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # Publisher confirms are what make the outbox SENT state trustworthy: without them the
    # database records a delivery the broker may never have persisted or been able to route.
    publisher-confirm-type: ${RABBITMQ_PUBLISHER_CONFIRM_TYPE:correlated}
    publisher-returns: ${RABBITMQ_PUBLISHER_RETURNS:true}
    template:
      mandatory: ${RABBITMQ_TEMPLATE_MANDATORY:true}
    listener:
      simple:
        auto-startup: ${RABBITMQ_LISTENER_AUTO_STARTUP:true}

app:
  agent:
    # Track A 所有键（见 docs/并行实施拆分方案.md）。生产必须有后台调度在跑，
    # 否则 Outbox 事件停在 PENDING、卡死的 Step 也无人回收，整条链路不会自动推进。
    scheduling:
      enabled: ${AGENT_SCHEDULING_ENABLED:true}
  security:
    auth-cookie-secure: ${AUTH_COOKIE_SECURE:true}
  review:
    inline: ${REVIEW_INLINE:false}
