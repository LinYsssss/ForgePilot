# Track A 独占配置：Agent 执行闭环与业务处理
#
# 归属见 docs/archive/并行实施拆分方案.md 第二节。Track B 不得修改本文件。
# 由 application.yml 的 spring.config.import 引入（非 optional，缺失即启动失败）。
#
# 注意：application-dev.yml / application-prod.yml 中的同名键优先级更高，
# 仍可正常覆盖本文件的默认值。

app:
  agent:
    # 后台调度总开关：Outbox 排空与 Step 恢复 watchdog 都靠它。
    # 默认关闭：测试上下文一旦后台运行就会与断言竞态，且没有 Broker 时
    # 每秒一次的连接失败会淹没日志。prod profile 显式打开；本地演示用
    # AGENT_SCHEDULING_ENABLED=true 打开。
    scheduling:
      enabled: ${AGENT_SCHEDULING_ENABLED:false}
    queue:
      max-retry: ${AGENT_QUEUE_MAX_RETRY:3}
      retry-delay-ms: ${AGENT_QUEUE_RETRY_DELAY_MS:5000}
    step:
      # 初始租约。Worker 每 heartbeat-interval 续租一次，因此该值只需覆盖
      # "两次心跳之间 + 时钟偏差"，不需要按最慢的一步来设。
      lease-duration: ${AGENT_STEP_LEASE_DURATION:3m}
      heartbeat-interval: ${AGENT_STEP_HEARTBEAT_INTERVAL:45s}
    recovery:
      enabled: ${AGENT_RECOVERY_ENABLED:true}
      stale-threshold: ${AGENT_RECOVERY_STALE_THRESHOLD:5m}
      batch-size: ${AGENT_RECOVERY_BATCH_SIZE:100}
      # 周期 watchdog：只在启动时恢复会让进程内挂掉的 Step 一直卡到下次重启。
      interval-ms: ${AGENT_RECOVERY_INTERVAL_MS:60000}
      initial-delay-ms: ${AGENT_RECOVERY_INITIAL_DELAY_MS:60000}
    tool:
      max-input-bytes: ${AGENT_TOOL_MAX_INPUT_BYTES:16384}
      max-output-bytes: ${AGENT_TOOL_MAX_OUTPUT_BYTES:65536}
    plan:
      default-tool-limit: ${AGENT_PLAN_DEFAULT_TOOL_LIMIT:3}
      max-argument-bytes: ${AGENT_PLAN_MAX_ARGUMENT_BYTES:16384}
    model:
      max-output-bytes: ${AGENT_MODEL_MAX_OUTPUT_BYTES:65536}
    outbox:
      retry-delay: ${AGENT_OUTBOX_RETRY_DELAY:10s}
      max-error-length: ${AGENT_OUTBOX_MAX_ERROR_LENGTH:2000}
      # 认领租约。发布线程崩溃后，reaper 要等租约到期才会回收事件，
      # 因此该值必须大于一次 Broker 往返（含 confirm 等待）的最坏耗时。
      lease-duration: ${AGENT_OUTBOX_LEASE_DURATION:60s}
      confirm-timeout: ${AGENT_OUTBOX_CONFIRM_TIMEOUT:10s}
      # 超过该次数转 FAILED 终态，不再重发，需人工介入。
      max-attempts: ${AGENT_OUTBOX_MAX_ATTEMPTS:8}
      batch-size: ${AGENT_OUTBOX_BATCH_SIZE:50}
      fixed-delay-ms: ${AGENT_OUTBOX_FIXED_DELAY_MS:1000}
      initial-delay-ms: ${AGENT_OUTBOX_INITIAL_DELAY_MS:5000}
  notify:
    # 报告链接前缀,填了会在通知里附「查看完整报告」
    base-url: ${NOTIFY_BASE_URL:}
    dingtalk:
      enabled: ${DINGTALK_ENABLED:false}
      webhook-url: ${DINGTALK_WEBHOOK_URL:}
      # 机器人安全设置用「加签」时填密钥;用「自定义关键词」则改填 keyword
      secret: ${DINGTALK_SECRET:}
      keyword: ${DINGTALK_KEYWORD:}
      # 低于该风险等级不通知:NONE < LOW < MEDIUM < HIGH
      min-risk: ${DINGTALK_MIN_RISK:LOW}
  review:
    inline: ${REVIEW_INLINE:true}
    max-diff-chars: ${REVIEW_MAX_DIFF_CHARS:20000}
    max-total-diff-chars: ${REVIEW_MAX_TOTAL_DIFF_CHARS:200000}
    max-files: ${REVIEW_MAX_FILES:40}
    max-retry: ${REVIEW_MAX_RETRY:3}
    max-prompt-chars: ${REVIEW_MAX_PROMPT_CHARS:48000}
  knowledge:
    # 上传边界。业务层按此上限流式读取，不再用无边界的 getBytes()；
    # 同时在 spring.servlet.multipart 处设了容器级上限做第一道拦截。
    max-file-bytes: ${KNOWLEDGE_MAX_FILE_BYTES:2097152}
    max-characters: ${KNOWLEDGE_MAX_CHARACTERS:400000}
  rag:
    mode: ${RAG_MODE:memory}
    chunk-size: ${RAG_CHUNK_SIZE:800}
    overlap: ${RAG_OVERLAP:100}
    top-k: ${RAG_TOP_K:5}
    full-context: ${RAG_FULL_CONTEXT:false}
    max-context-chars: ${RAG_MAX_CONTEXT_CHARS:6000}
  # ForgePilot P2:场景化上下文组装(ContextBuilder,REQUIREMENT_CHECK 场景)。
  context:
    knowledge-top-k: ${CONTEXT_KNOWLEDGE_TOP_K:5}
    max-snippet-chars: ${CONTEXT_MAX_SNIPPET_CHARS:1200}
  ai:
    runtime: ${AI_RUNTIME:legacy}
    provider: ${AI_PROVIDER:mock}
    base-url: ${LLM_BASE_URL:}
    api-key: ${LLM_API_KEY:}
    chat-model: ${LLM_CHAT_MODEL:mock-reviewer}
    temperature: ${AI_TEMPERATURE:0.0}
    read-timeout-ms: ${AI_READ_TIMEOUT_MS:300000}
    embedding-provider: ${EMBEDDING_PROVIDER:${AI_PROVIDER:mock}}
    embedding-base-url: ${EMBEDDING_BASE_URL:${LLM_BASE_URL:}}
    embedding-api-key: ${EMBEDDING_API_KEY:${LLM_API_KEY:}}
    embedding-model: ${LLM_EMBEDDING_MODEL:mock-embedding}
    embedding-version: ${EMBEDDING_VERSION:${LLM_EMBEDDING_MODEL:mock-embedding}}
    embedding-dimensions: ${EMBEDDING_DIMENSIONS:0}
    embedding-max-input-chars: ${EMBEDDING_MAX_INPUT_CHARS:32000}
    embedding-read-timeout-ms: ${EMBEDDING_READ_TIMEOUT_MS:${AI_READ_TIMEOUT_MS:300000}}
