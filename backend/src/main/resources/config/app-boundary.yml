# Track B 独占配置：安全基础设施与外部边界
#
# 归属见 docs/并行实施拆分方案.md 第二节。Track A 不得修改本文件。
# 由 application.yml 的 spring.config.import 引入（非 optional，缺失即启动失败）。
#
# 注意：application-dev.yml / application-prod.yml 中的同名键优先级更高，
# 仍可正常覆盖本文件的默认值（dev 覆盖 app.git.allow-local-path，
# prod 覆盖 app.security.auth-cookie-secure）。

app:
  git:
    allow-local-path: ${GIT_ALLOW_LOCAL_PATH:false}
  ratelimit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    limit: ${RATE_LIMIT_REQUESTS:120}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
    # 登录端点单独计数并收紧:通用额度对密码爆破而言过松
    login-limit: ${RATE_LIMIT_LOGIN_REQUESTS:8}
  security:
    # 受信代理网段:只有直连对端落在这里时,才采信它发来的 X-Forwarded-For。
    # 默认覆盖本机与 Docker/内网网段(生产部署里 nginx 与后端同处 compose 网络)。
    # 若源站直接暴露给公网负载均衡,应改成该 LB 的实际网段。
    trusted-proxies: ${TRUSTED_PROXIES:127.0.0.1,::1,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
    token-secret: ${JWT_SECRET:dev-secret-change-me}
    token-ttl-seconds: ${TOKEN_TTL_SECONDS:86400}
    token-encrypt-key: ${TOKEN_ENCRYPT_KEY:dev-token-encryption-key-change-me}
    auth-cookie-name: ${AUTH_COOKIE_NAME:reposage_auth}
    auth-cookie-secure: ${AUTH_COOKIE_SECURE:false}
    auth-cookie-same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
    login:
      # 按用户名维度的失败节流,与 ratelimit 的 IP 维度互补:
      # 只按 IP 拦不住换代理猛撞同一账号,只按用户名拦不住同 IP 轮撞多个账号。
      max-failures-per-username: ${LOGIN_MAX_FAILURES_PER_USERNAME:10}
      failure-window-seconds: ${LOGIN_FAILURE_WINDOW_SECONDS:600}
    seed-admin:
      username: ${SEED_ADMIN_USERNAME:}
      password: ${SEED_ADMIN_PASSWORD:}
      nickname: ${SEED_ADMIN_NICKNAME:管理员}
      role: ${SEED_ADMIN_ROLE:ADMIN}
    # 跨线契约 4（Phase 0 冻结）：SPA CSRF 开关位。
    # 合流阶段（integration/track-ab）已按契约统一打开：部署默认启用，
    # SECURITY_CSRF_ENABLED=false 是显式回退口。存量测试不带 CSRF token，
    # 由 backend/pom.xml 的 surefire systemPropertyVariables 统一置 false；
    # CsrfProtectionTest 用内联属性（优先级更高）单独验证打开后的行为。
    csrf:
      enabled: ${SECURITY_CSRF_ENABLED:true}
  http:
    connect-timeout-ms: ${HTTP_CONNECT_TIMEOUT_MS:10000}
    read-timeout-ms: ${HTTP_READ_TIMEOUT_MS:60000}
  model-service:
    enabled: ${MODEL_SERVICE_ENABLED:false}
    base-url: ${MODEL_SERVICE_URL:}
  sandbox:
    signing-secret: ${SANDBOX_SIGNING_SECRET:}
    tool-image: ${SANDBOX_TOOL_IMAGE:}
    tool-timeout-ms: ${SANDBOX_TOOL_TIMEOUT_MS:120000}
    # 工作区归档:backend 是唯一生产者,写入与 sandbox-runner 共享的卷(runner 只读消费)。
    # 本地 dev/test 没有 /app,该路径必须可配置;Spring 上下文测试一律覆盖到
    # ${java.io.tmpdir}(F-02 教训:CI runner 非 root,/app 不可写)。
    archive-root: ${SANDBOX_ARCHIVE_ROOT:/app/archives}
    # TTL 兜底清扫:正常完成的 Run 在发布步骤就地清理;FAILED/TIMED_OUT 的归档保留到
    # TTL 以便运维 reopenForRetry 续跑,连同崩溃残留一起由清扫回收,防共享卷膨胀。
    # 设 0 或负值可停用清扫。
    archive-ttl: ${SANDBOX_ARCHIVE_TTL:PT6H}
  scm:
    allow-insecure-localhost: ${SCM_ALLOW_INSECURE_LOCALHOST:false}
    webhook:
      # 报文可能带分支名、提交信息等仓库内容,默认不入库;仅供本地排障时临时开启。
      store-payload-preview: ${SCM_WEBHOOK_STORE_PAYLOAD_PREVIEW:false}
