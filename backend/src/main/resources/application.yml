spring:
  application:
    name: forgepilot-backend
  datasource:
    url: ${FORGEPILOT_DB_URL:jdbc:postgresql://localhost:5432/forgepilot}
    username: ${FORGEPILOT_DB_USERNAME:forgepilot}
    password: ${FORGEPILOT_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${FORGEPILOT_DB_POOL_SIZE:5}
  flyway:
    enabled: true
    baseline-on-migrate: false
    clean-disabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
