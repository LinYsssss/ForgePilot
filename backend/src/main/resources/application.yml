spring:
  application:
    name: reposage
  profiles:
    active: ${APP_ENV:dev}

server:
  port: ${SERVER_PORT:8080}

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      show-components: when_authorized
  metrics:
    tags:
      application: ${spring.application.name:reposage}

resilience4j:
  retry:
    instances:
      aiReview:
        max-attempts: ${AI_RETRY_MAX_ATTEMPTS:3}
        wait-duration: ${AI_RETRY_WAIT:2s}
        retry-exceptions:
          - com.example.codereview.ai.AiCallTransientException
  circuitbreaker:
    instances:
      aiReview:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 60
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        record-exceptions:
          - com.example.codereview.ai.AiCallTransientException

app:
  agent:
    budget:
      max-elapsed: ${AGENT_MAX_ELAPSED:10m}
      max-tool-calls: ${AGENT_MAX_TOOL_CALLS:20}
      max-model-calls: ${AGENT_MAX_MODEL_CALLS:6}
      max-input-tokens: ${AGENT_MAX_INPUT_TOKENS:60000}
      max-output-tokens: ${AGENT_MAX_OUTPUT_TOKENS:12000}
      max-estimated-cost: ${AGENT_MAX_ESTIMATED_COST:2.00}
  git:
    allow-local-path: ${GIT_ALLOW_LOCAL_PATH:false}
  ratelimit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    limit: ${RATE_LIMIT_REQUESTS:120}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
  security:
    token-secret: ${JWT_SECRET:dev-secret-change-me}
    token-ttl-seconds: ${TOKEN_TTL_SECONDS:86400}
    token-encrypt-key: ${TOKEN_ENCRYPT_KEY:dev-token-encryption-key-change-me}
    auth-cookie-name: ${AUTH_COOKIE_NAME:reposage_auth}
    auth-cookie-secure: ${AUTH_COOKIE_SECURE:false}
    auth-cookie-same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
    seed-admin:
      username: ${SEED_ADMIN_USERNAME:}
      password: ${SEED_ADMIN_PASSWORD:}
      nickname: ${SEED_ADMIN_NICKNAME:管理员}
      role: ${SEED_ADMIN_ROLE:ADMIN}
  http:
    connect-timeout-ms: ${HTTP_CONNECT_TIMEOUT_MS:10000}
    read-timeout-ms: ${HTTP_READ_TIMEOUT_MS:60000}
  model-service:
    enabled: ${MODEL_SERVICE_ENABLED:false}
    base-url: ${MODEL_SERVICE_URL:}
  review:
    inline: ${REVIEW_INLINE:true}
    max-diff-chars: ${REVIEW_MAX_DIFF_CHARS:20000}
    max-total-diff-chars: ${REVIEW_MAX_TOTAL_DIFF_CHARS:200000}
    max-files: ${REVIEW_MAX_FILES:40}
    max-retry: ${REVIEW_MAX_RETRY:3}
    max-prompt-chars: ${REVIEW_MAX_PROMPT_CHARS:48000}
  rag:
    mode: ${RAG_MODE:memory}
    chunk-size: ${RAG_CHUNK_SIZE:800}
    overlap: ${RAG_OVERLAP:100}
    top-k: ${RAG_TOP_K:5}
    full-context: ${RAG_FULL_CONTEXT:false}
    max-context-chars: ${RAG_MAX_CONTEXT_CHARS:6000}
  ai:
    provider: ${AI_PROVIDER:mock}
    base-url: ${LLM_BASE_URL:}
    api-key: ${LLM_API_KEY:}
    chat-model: ${LLM_CHAT_MODEL:mock-reviewer}
    read-timeout-ms: ${AI_READ_TIMEOUT_MS:300000}
    embedding-provider: ${EMBEDDING_PROVIDER:${AI_PROVIDER:mock}}
    embedding-base-url: ${EMBEDDING_BASE_URL:${LLM_BASE_URL:}}
    embedding-api-key: ${EMBEDDING_API_KEY:${LLM_API_KEY:}}
    embedding-model: ${LLM_EMBEDDING_MODEL:mock-embedding}
