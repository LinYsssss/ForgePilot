spring:
  application:
    name: reposage
  profiles:
    active: ${APP_ENV:dev}
  # app.* 按所有权拆分到两个文件，供并行开发时互不冲突地修改。
  # 见 docs/并行实施拆分方案.md。刻意不使用 optional:——文件缺失时
  # 必须启动失败，而不是静默丢掉整块安全配置。
  config:
    import:
      - classpath:config/app-agent.yml
      - classpath:config/app-boundary.yml

server:
  port: ${SERVER_PORT:8080}

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"

management:
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://otel-collector:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      show-components: when_authorized
  metrics:
    tags:
      application: ${spring.application.name:reposage}
    distribution:
      percentiles-histogram:
        reposage.agent.step: true
        reposage.agent.tool: true

resilience4j:
  retry:
    instances:
      aiReview:
        max-attempts: ${AI_RETRY_MAX_ATTEMPTS:3}
        wait-duration: ${AI_RETRY_WAIT:2s}
        retry-exceptions:
          - com.example.codereview.ai.AiCallTransientException
  circuitbreaker:
    instances:
      aiReview:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 60
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        record-exceptions:
          - com.example.codereview.ai.AiCallTransientException
