name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify backend
        working-directory: backend
        run: mvn -s .mvn/settings.xml verify

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Check model service
        working-directory: model-service
        run: |
          python -m pip install -r requirements.txt
          python - <<'PY'
          from app.main import PredictRequest, load_model, model_status, predict
          load_model()
          status = model_status().model_dump()
          result = predict(PredictRequest(
              filePath="AdminOrderController.java",
              diffText='+@PostMapping("/admin/orders/{id}/force-ship")'
          )).model_dump()
          assert status["modelLoaded"], status
          assert result["source"] == "trained-model", result
          PY
