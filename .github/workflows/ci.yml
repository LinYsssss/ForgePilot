name: ci

on:
  push:
  pull_request:

# 默认只读:CI 不需要写仓库,最小权限可限制被攻陷的 action 能做什么
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          # 与 frontend/package.json 的 engines 和 frontend/Dockerfile 保持一致
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify backend
        working-directory: backend
        run: mvn -B -s .mvn/settings.xml verify

      # 沙箱执行器是安全边界的一部分,其测试必须进合并门禁,
      # 否则它的测试可以静默退化而 CI 依然全绿。
      # settings 复用 backend 的同一份(F-11):两个模块必须走同一套仓库解析
      # (覆盖宿主机全局镜像、强制 HTTPS Central),否则宿主机存在全局
      # Maven 镜像时两模块的依赖来源会分歧。
      - name: Verify sandbox runner
        working-directory: sandbox-runner
        run: mvn -B -s ../backend/.mvn/settings.xml verify

      # 前端 lockfile 供应链一致性(F-06):依赖完整性必须锚定官方 registry。
      # resolved 指向第三方镜像会把完整性信任转嫁给镜像站,且 npm>=12 直接拒装。
      - name: Check frontend lockfile registry source
        working-directory: frontend
        run: |
          bad="$(grep '"resolved":' package-lock.json | grep -v '"resolved": "https://registry.npmjs.org/' || true)"
          if [ -n "$bad" ]; then
            echo "package-lock.json contains resolved URLs outside registry.npmjs.org:"
            echo "$bad"
            exit 1
          fi

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Test model service
        working-directory: model-service
        run: |
          python -m pip install -r requirements.txt
          python -m pytest tests/ -q

  # 边缘代理是浏览器侧安全头的唯一出口(P1-16),配置退化必须挡在合并前。
  nginx-headers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify edge security headers
        run: deploy/test-nginx-headers.sh

  # 供应链门禁(P1-24):npm audit 只覆盖前端,这里把 Maven、Python 与四个业务镜像补齐。
  # 口径与 deploy/scan-images.sh 一致:HIGH/CRITICAL 且已有修复版本才拦,无修复的不空转。
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Scan dependency manifests (Maven + npm + Python)
        # v0.29.0 及更早版本钉住的 setup-trivy 旧 tag 已被上游删除,永远无法解析;
        # v0.33.1 起按 commit SHA 钉依赖,故取当前最新稳定版。
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Build images
        run: |
          docker build -t reposage-backend:ci backend
          docker build -t reposage-frontend:ci frontend
          docker build -t reposage-sandbox-runner:ci sandbox-runner
          docker build -t reposage-model-service:ci model-service

      - name: Scan images
        run: deploy/scan-images.sh reposage-backend:ci reposage-frontend:ci reposage-sandbox-runner:ci reposage-model-service:ci
