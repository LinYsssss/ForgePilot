name: Phase 1 CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: phase1-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend foundation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify backend, database, and architecture contracts
        run: ./mvnw -B -ntp verify

  frontend:
    name: Frontend foundation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --run
      - run: npm run build

  evaluation:
    name: Evaluation contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate quick-set corpus
        run: >-
          python3 evaluation/tools/score.py --validate-corpus
          --manifest evaluation/manifest.quick.json
          --case-set evaluation/case-sets/phase1-quick.json
      - name: Run deterministic scorer self-test
        run: python3 evaluation/tools/score.py --selftest
      - name: Recompute and compare the synthetic reference report
        run: |
          score_dir="${RUNNER_TEMP}/forgepilot-phase1-scores"
          python3 evaluation/tools/score.py --manifest evaluation/manifest.quick.json --runs evaluation/reference-runs --out-dir "$score_dir"
          python3 evaluation/tools/score.py --compare-report "$score_dir/scores-reference.json" evaluation/fixtures/phase1-reference-score.json
      - name: Reject holdout fixtures and results
        run: python3 evaluation/tools/score.py --guard-no-holdout --root .

  compose-smoke:
    name: Empty-stack Compose smoke
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - evaluation
    timeout-minutes: 30
    env:
      FORGEPILOT_BIND_ADDRESS: 127.0.0.1
      FORGEPILOT_BACKEND_PORT: "18080"
      FORGEPILOT_FRONTEND_PORT: "18081"
      FORGEPILOT_DB_PASSWORD: forgepilot-phase1-ci-only
      FORGEPILOT_SCM_SECRET_KEY: forgepilot-ci-only-not-a-real-key
    steps:
      - uses: actions/checkout@v4
      - name: Run two fresh-volume cold starts
        run: |
          scripts/phase1-compose-smoke.sh "forgepilot-phase1-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-a"
          scripts/phase1-compose-smoke.sh "forgepilot-phase1-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-b"
