# =============================================================================
# Alertmanager 配置(MVP:单一路由 → 默认接收器)。
#
# 外发 webhook 地址属部署机密且随环境变化,不写死在本文件;Alertmanager 官方
# 镜像与配置格式都不支持环境变量插值,由 alertmanager-entrypoint.sh 在容器
# 启动时按 ALERT_WEBHOOK_URL 注入:
#   - 未配置(默认):本文件原样生效,default 接收器不带任何通知集成,
#     告警仅在 Alertmanager UI(127.0.0.1:9093)与 Prometheus /alerts 页可见;
#   - 已配置:下方 #__WEBHOOK_SLOT__ 占位注释被替换为 webhook_configs 段。
#
# 钉钉群机器人不认 Alertmanager 原生 webhook 载荷,接钉钉需经
# prometheus-webhook-dingtalk 桥接(可选组件,接法见 observability/README.md;
# backend 自带的 DingTalkNotifier 是业务事件通知,不复用于基础设施告警)。
# =============================================================================
route:
  receiver: default
  # 演示栈告警量极小,按告警名聚组即可;间隔取保守值,防同一故障反复轰炸。
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
    # 下一行是入口脚本的替换锚点(整行被替换为 webhook_configs 段),
    # 不要改动其缩进与文字,也不要在它前面插入其他接收器字段。
    #__WEBHOOK_SLOT__
