global:
  scrape_interval: 15s
  # 告警规则求值与抓取同频:演示环境希望规则尽快出结果,默认的 1m 偏慢。
  evaluation_interval: 15s

# 告警规则由 compose 挂载(源文件 deploy/observability/alerts.yml)。
rule_files:
  - /etc/prometheus/alerts.yml

# 求值出的告警推给 Alertmanager,容器网内服务名直连,不经宿主端口。
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: reposage-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [backend:8080]
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:9464]
  # RabbitMQ prometheus 插件。默认 /metrics 只给聚合指标、没有 queue 标签,
  # 而队列积压/死信告警必须按队列名区分,所以抓 per-object 端点;
  # 本栈队列总数不到 10 个,per-object 的额外开销可忽略。
  # 15692 只在容器网内可达,未发布到宿主。
  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets: [rabbitmq:15692]
