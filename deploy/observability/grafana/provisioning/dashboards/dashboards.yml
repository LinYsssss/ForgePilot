# Grafana 看板自动装配:扫描容器内 /etc/grafana/dashboards(compose 只读挂载
# deploy/observability/grafana/dashboards/)下的全部 JSON。
# 看板以文件为准:UI 里的修改不回写文件,容器重建即回到文件版本 —— 想固化改动,
# 在 UI 导出 JSON 覆盖仓库文件。
apiVersion: 1
providers:
  - name: reposage
    type: file
    folder: RepoSage
    allowUiUpdates: false
    options:
      path: /etc/grafana/dashboards
