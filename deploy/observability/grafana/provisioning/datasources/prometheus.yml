# Grafana 数据源自动装配:唯一数据源指向栈内 Prometheus。
# uid 固定为 prometheus —— 看板 JSON 里的 datasource 引用靠它对上,不能改。
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    # 锁死编辑:数据源由文件装配,UI 里改了重启就丢,不如禁掉少一个坑。
    editable: false
    jsonData:
      # 与 prometheus.yml 的 scrape_interval 对齐,否则短区间 rate() 会断点。
      timeInterval: 15s
