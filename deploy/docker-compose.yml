services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: code_review
      POSTGRES_USER: code_review
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U code_review -d code_review"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 768m

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 30s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    mem_limit: 384m
    memswap_limit: 512m

  backend:
    build:
      context: ../backend
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      model-service:
        condition: service_started
      otel-collector:
        condition: service_started
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60.0
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../demo-repos:/app/demo-repos:ro
      - backend_work:/app/.work
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 70s
    restart: unless-stopped
    mem_limit: 1200m
    memswap_limit: 1800m

  # Trusted orchestration component for controlled single-host demos. This is not a hostile
  # multi-tenant isolation boundary. Only the runner receives the Docker socket; containers it
  # launches must never inherit that mount.
  sandbox-runner:
    build:
      context: ../sandbox-runner
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      SANDBOX_SIGNING_SECRET: ${SANDBOX_SIGNING_SECRET:?SANDBOX_SIGNING_SECRET is required}
      SANDBOX_DEPENDENCY_CACHE_ROOT: /app/.cache/dependencies
      SANDBOX_ARCHIVE_ROOT: /app/archives
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=50.0
    depends_on:
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sandbox_work:/app/.work
      - sandbox_dependency_cache:/app/.cache/dependencies
      - sandbox_archives:/app/archives:ro
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 768m

  model-service:
    build:
      context: ../model-service
    environment:
      MODEL_PATH: /app/models/risk_classifier.joblib
      MODEL_VERSION: docker-demo-v1
    # 不发布宿主端口:只有 backend 需要访问它,compose 网络内以服务名直连即可。
    # 发布出去徒增暴露面 —— 该服务没有任何认证。
    expose:
      - "8000"
    restart: unless-stopped
    mem_limit: 768m
    memswap_limit: 1280m

  frontend:
    build:
      context: ../frontend
      args:
        VITE_DEMO_REPO_PATH: ${VITE_DEMO_REPO_PATH:-/app/demo-repos/mall-order-service}
    depends_on:
      - backend
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m

  nginx:
    image: nginx:1.30.4-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol/config.yml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:9464:9464"
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m

  prometheus:
    image: prom/prometheus:v2.53.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend
      - otel-collector
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 768m

volumes:
  postgres_data:
  backend_work:
  sandbox_work:
  sandbox_dependency_cache:
  sandbox_archives:
