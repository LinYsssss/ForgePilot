services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: code_review
      POSTGRES_USER: code_review
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"

  backend:
    build:
      context: ../backend
    env_file:
      - .env
    depends_on:
      - postgres
      - rabbitmq
      - model-service
    ports:
      - "8080:8080"
    volumes:
      - ../demo-repos:/app/demo-repos:ro
      - backend_work:/app/.work

  model-service:
    build:
      context: ../model-service
    environment:
      MODEL_PATH: /app/models/risk_classifier.joblib
      MODEL_VERSION: docker-demo-v1
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ../frontend
      args:
        VITE_DEMO_REPO_PATH: ${VITE_DEMO_REPO_PATH:-/app/demo-repos/mall-order-service}
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  backend_work:
