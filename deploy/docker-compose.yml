# 单机演示宿主没有日志采集侧车,容器日志就地留存。不封顶的话一次崩溃循环
# 就能刷爆磁盘 —— 每个服务最多 3 个 10m 分片,整栈(11 个服务)上限约 330m。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: code_review
      POSTGRES_USER: code_review
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U code_review -d code_review"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 768m
    logging: *default-logging

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    volumes:
      # 显式钉死插件清单:management(既有管理台)+ prometheus(15692 指标端点)。
      # 不依赖镜像默认插件集,防镜像升级悄悄改变启用面;文件是 Erlang term,
      # 末尾句点必须保留。
      - ./observability/rabbitmq-enabled-plugins:/etc/rabbitmq/enabled_plugins:ro
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    # 指标端口只在容器网内给 Prometheus 抓取(per-object 端点),不发布到宿主。
    expose:
      - "15692"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 30s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    mem_limit: 384m
    memswap_limit: 512m
    logging: *default-logging

  backend:
    build:
      context: ../backend
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60.0
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../demo-repos:/app/demo-repos:ro
      - backend_work:/app/.work
      # 工作区归档链路:backend 在派发沙箱作业前把归档写进该卷(唯一生产者),
      # sandbox-runner 以只读挂载消费(见下方 :ro)。读写方向不能颠倒。
      - sandbox_archives:/app/archives
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 70s
    restart: unless-stopped
    mem_limit: 1200m
    memswap_limit: 1800m
    logging: *default-logging

  # Trusted orchestration component for controlled single-host demos. This is not a hostile
  # multi-tenant isolation boundary. Only the runner receives the Docker socket; containers it
  # launches must never inherit that mount.
  sandbox-runner:
    build:
      context: ../sandbox-runner
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      SANDBOX_SIGNING_SECRET: ${SANDBOX_SIGNING_SECRET:?SANDBOX_SIGNING_SECRET is required}
      SANDBOX_DEPENDENCY_CACHE_ROOT: /app/.cache/dependencies
      SANDBOX_ARCHIVE_ROOT: /app/archives
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=50.0
    depends_on:
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sandbox_work:/app/.work
      - sandbox_dependency_cache:/app/.cache/dependencies
      - sandbox_archives:/app/archives:ro
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 768m
    logging: *default-logging

  frontend:
    build:
      context: ../frontend
      args:
        VITE_DEMO_REPO_PATH: ${VITE_DEMO_REPO_PATH:-/app/demo-repos/mall-order-service}
    depends_on:
      - backend
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    logging: *default-logging

  nginx:
    image: nginx:1.30.4-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    logging: *default-logging

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol/config.yml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:9464:9464"
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v2.53.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      - backend
      - otel-collector
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 768m
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:v0.27.0
    # 官方镜像不支持配置文件里的环境变量插值,入口包装脚本按 ALERT_WEBHOOK_URL
    # 生成运行时配置:为空(默认)= 空接收器,告警仅在 UI 可见;非空 = 外发到该
    # webhook。钉钉需经桥接组件,见 observability/README.md。
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    environment:
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./observability/alertmanager-entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro
    ports:
      - "127.0.0.1:9093:9093"
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 192m
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      # 仅绑定 127.0.0.1,远程访问走 SSH 隧道;初始密码用 .env 覆盖,首次登录改掉。
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      # 数据源与看板全部由 provisioning 文件装配,不挂持久卷:
      # UI 改动不落盘,容器重建即回到仓库文件版本(见 observability/README.md)。
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 384m
    logging: *default-logging

volumes:
  postgres_data:
  backend_work:
  sandbox_work:
  sandbox_dependency_cache:
  sandbox_archives:
