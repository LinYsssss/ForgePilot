services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: code_review
      POSTGRES_USER: code_review
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

  backend:
    build:
      context: ../backend
    env_file:
      - .env
    depends_on:
      - postgres
      - rabbitmq
      - model-service
      - otel-collector
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../demo-repos:/app/demo-repos:ro
      - backend_work:/app/.work

  # Trusted orchestration component for controlled single-host demos. This is not a hostile
  # multi-tenant isolation boundary. Only the runner receives the Docker socket; containers it
  # launches must never inherit that mount.
  sandbox-runner:
    build:
      context: ../sandbox-runner
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      SANDBOX_SIGNING_SECRET: ${SANDBOX_SIGNING_SECRET:?SANDBOX_SIGNING_SECRET is required}
      SANDBOX_DEPENDENCY_CACHE_ROOT: /app/.cache/dependencies
      SANDBOX_ARCHIVE_ROOT: /app/archives
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on:
      - rabbitmq
      - otel-collector
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sandbox_work:/app/.work
      - sandbox_dependency_cache:/app/.cache/dependencies
      - sandbox_archives:/app/archives:ro
    restart: unless-stopped

  model-service:
    build:
      context: ../model-service
    environment:
      MODEL_PATH: /app/models/risk_classifier.joblib
      MODEL_VERSION: docker-demo-v1
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ../frontend
      args:
        VITE_DEMO_REPO_PATH: ${VITE_DEMO_REPO_PATH:-/app/demo-repos/mall-order-service}
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol/config.yml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:9464:9464"

  prometheus:
    image: prom/prometheus:v2.53.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend
      - otel-collector
    ports:
      - "127.0.0.1:9090:9090"

volumes:
  postgres_data:
  backend_work:
  sandbox_work:
  sandbox_dependency_cache:
  sandbox_archives:
