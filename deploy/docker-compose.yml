services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: code_review
      POSTGRES_USER: code_review
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-code_review}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-change-me}
    ports:
      - "5672:5672"
      - "15672:15672"

  backend:
    build:
      context: ../backend
    env_file:
      - .env
    depends_on:
      - postgres
      - rabbitmq
      - model-service
    ports:
      - "8080:8080"
    volumes:
      - ../demo-repos:/app/demo-repos:ro
      - backend_work:/app/.work

  # Trusted orchestration component for controlled single-host demos. This is not a hostile
  # multi-tenant isolation boundary. Only the runner receives the Docker socket; containers it
  # launches must never inherit that mount.
  sandbox-runner:
    build:
      context: ../sandbox-runner
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-code_review}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-change-me}
      SANDBOX_SIGNING_SECRET: ${SANDBOX_SIGNING_SECRET:?SANDBOX_SIGNING_SECRET is required}
      SANDBOX_DEPENDENCY_CACHE_ROOT: /app/.cache/dependencies
    depends_on:
      - rabbitmq
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sandbox_work:/app/.work
      - sandbox_dependency_cache:/app/.cache/dependencies
    restart: unless-stopped

  model-service:
    build:
      context: ../model-service
    environment:
      MODEL_PATH: /app/models/risk_classifier.joblib
      MODEL_VERSION: docker-demo-v1
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ../frontend
      args:
        VITE_DEMO_REPO_PATH: ${VITE_DEMO_REPO_PATH:-/app/demo-repos/mall-order-service}
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  backend_work:
  sandbox_work:
  sandbox_dependency_cache:
