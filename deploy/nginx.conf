server {
    listen 80;
    server_name _;

    # 不在响应头里报出 nginx 版本号,少给漏洞利用一个定位信息。
    server_tokens off;

    # 用 Docker 内置 DNS 动态解析 upstream。配合下方“变量式 proxy_pass”,
    # nginx 每次请求都重新解析主机名 —— backend/frontend 容器重建换 IP 后不会再 502。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---- 安全响应头(P1-16)----
    # 统一放在 server 级。nginx 的 add_header 是“整组继承”:任何 location 里再写
    # add_header 都会把这一组全部丢弃,所以各 location 一律不再单独加头。
    # `always` 使 4xx/5xx 响应同样携带,下面的 404 拦截路径顺带成为测试锚点。
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # CSP 按前端实际需要收紧:脚本只允许同源打包产物;样式需 'unsafe-inline'
    # (Vue 的 :style 绑定落成 style 属性)并放行 Google Fonts 的样式与字体;
    # 图标用 data: URI;fetch/SSE 全部同源;不嵌入任何 iframe,也不允许被嵌入。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # 浏览器只在 HTTPS 响应里认 HSTS,纯 HTTP 演示环境下这行是惰性的;
    # 一旦前面加了 TLS 终止,它立即生效。暂不加 includeSubDomains/preload,留退路。
    add_header Strict-Transport-Security "max-age=15552000" always;

    location / {
        set $upstream_frontend http://frontend:80;
        proxy_pass $upstream_frontend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        set $upstream_backend http://backend:8080;
        proxy_pass $upstream_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Agent 时间线的 SSE 流单独成段:代理缓冲会把事件憋在 nginx 里直到超时,必须关掉;
    # 默认 60s 读超时会周期性掐断长连接造成重连风暴,放宽到 1h(只对这一条路径)。
    location ~ ^/api/agent-runs/[^/]+/events$ {
        set $upstream_backend_sse http://backend:8080;
        proxy_pass $upstream_backend_sse$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # 仅对外暴露健康检查;prometheus/metrics/info 等一律拦掉。
    # 指标只在容器网络内被 Prometheus 抓取(直连 backend:8080,不经 nginx)。
    location = /actuator/health {
        set $upstream_health http://backend:8080;
        proxy_pass $upstream_health$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /actuator/ {
        return 404;
    }
}
