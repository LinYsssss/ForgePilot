# =============================================================================
# TLS 叠加层 —— 与基础 docker-compose.yml 组合使用,全部 TLS 改动由本文件承载。
# 删除/不引用本文件即回到纯 HTTP 原状,基础栈文件零 diff。
#
# 用法(在 deploy/ 目录下执行):
#   ./tls/gen-self-signed.sh                                        # 先生成自签证书(或放入真实证书)
#   docker compose -f docker-compose.yml -f tls/docker-compose.tls.yml up -d
#
# 路径坑:多文件 compose 的相对路径一律相对第一个 -f 文件所在目录(即 deploy/)
# 解析,所以本文件里的挂载路径都写 ./tls/ 前缀,而不是相对本文件自身。
# =============================================================================
services:
  nginx:
    volumes:
      # 与基础文件同一容器目标路径(/etc/nginx/conf.d/default.conf)的挂载,
      # 按 compose 多文件合并规则直接覆盖基础的 nginx.conf 挂载,不会重复挂两份。
      - ./tls/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      # 证书目录只读挂载;certs/ 已被 gitignore,证书与私钥永不入库。
      - ./tls/certs:/etc/nginx/certs:ro
    ports:
      # ports 按合并规则是"追加":80:80 已由基础文件发布(TLS 形态下 80 只做
      # 301 跳转),这里只补 443。
      - "443:443"
