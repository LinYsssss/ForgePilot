# =============================================================================
# TLS 终止叠加配置 —— 由 tls/docker-compose.tls.yml 挂载,整体替换基础 nginx.conf。
#
# 维护契约:443 server 块必须逐条继承基础 deploy/nginx.conf 的全部语义
# (安全头组、变量式 proxy_pass、SSE 专段、actuator 拦截)。基础配置有改动时
# 必须同步到这里;两份不一致时,以基础配置的语义为准修正本文件。
# 回滚:compose 启动时不再叠加 tls/docker-compose.tls.yml 即回到纯 HTTP 原状,
# 基础栈文件零 diff(见 tls/README.md)。
# =============================================================================

# 80 端口在 TLS 形态下只负责把明文流量赶去 https,不再代理任何业务。
# $host 原样保留访问者请求的主机名,IP 与域名两种访问方式都能正确跳转。
# 跳转响应没有可渲染内容,安全头组不在此块重复(HSTS 本就只在 HTTPS 响应上被浏览器采信)。
server {
    listen 80;
    server_name _;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    # ---- TLS 参数 ----
    # 证书由 tls/docker-compose.tls.yml 把 tls/certs/ 挂到 /etc/nginx/certs;
    # 自签用 tls/gen-self-signed.sh 生成,换真实证书只需同名覆盖(见 tls/README.md)。
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    # 只保留现代协议;TLSv1.0/1.1 已被主流浏览器与合规基线淘汰,留着只会喂安全扫描器。
    ssl_protocols TLSv1.2 TLSv1.3;
    # 刻意不手写加密套件清单:nginx 内置默认集已剔除弱套件,手写清单会随年代腐化
    # 反而更危险;TLSv1.3 的套件本就不受 ssl_ciphers 控制。关闭服务器侧优先,
    # 让新客户端自行协商更优套件。
    ssl_prefer_server_ciphers off;
    # 会话复用降低重复握手开销;单机演示规模下 10m 共享缓存(约 4 万会话)绰绰有余。
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    # ---- 以下逐条继承基础 nginx.conf 的 server 块语义 ----

    # 不在响应头里报出 nginx 版本号,少给漏洞利用一个定位信息。
    server_tokens off;

    # 用 Docker 内置 DNS 动态解析 upstream。配合下方"变量式 proxy_pass",
    # nginx 每次请求都重新解析主机名 —— backend/frontend 容器重建换 IP 后不会再 502。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---- 安全响应头(P1-16)----
    # 统一放在 server 级。nginx 的 add_header 是"整组继承":任何 location 里再写
    # add_header 都会把这一组全部丢弃,所以各 location 一律不再单独加头。
    # `always` 使 4xx/5xx 响应同样携带,下面的 404 拦截路径顺带成为测试锚点。
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # CSP 与基础配置保持同一收紧口径:脚本只允许同源打包产物;样式需 'unsafe-inline'
    # (Vue 的 :style 绑定落成 style 属性);字体全部同源,不放行任何远端字体域;
    # 图标用 data: URI;fetch/SSE 全部同源;不嵌入任何 iframe,也不允许被嵌入。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # 基础配置里预埋的 HSTS 在这里(HTTPS 响应)真正生效:180 天内浏览器强制走 https。
    # 暂不加 includeSubDomains/preload,留退路;回退纯 HTTP 前注意浏览器已缓存的
    # HSTS 状态(真实受信证书场景才会被记住),细节见 tls/README.md「回滚」。
    add_header Strict-Transport-Security "max-age=15552000" always;

    location / {
        set $upstream_frontend http://frontend:80;
        proxy_pass $upstream_frontend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        set $upstream_backend http://backend:8080;
        proxy_pass $upstream_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Agent 时间线的 SSE 流单独成段:代理缓冲会把事件憋在 nginx 里直到超时,必须关掉;
    # 默认 60s 读超时会周期性掐断长连接造成重连风暴,放宽到 1h(只对这一条路径)。
    location ~ ^/api/agent-runs/[^/]+/events$ {
        set $upstream_backend_sse http://backend:8080;
        proxy_pass $upstream_backend_sse$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # 仅对外暴露健康检查;prometheus/metrics/info 等一律拦掉。
    # 指标只在容器网络内被 Prometheus 抓取(直连 backend:8080,不经 nginx)。
    location = /actuator/health {
        set $upstream_health http://backend:8080;
        proxy_pass $upstream_health$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /actuator/ {
        return 404;
    }
}
